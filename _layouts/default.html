<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ page.title }} | Simon Panaretou</title>

  <style>

    html {
      background-color: #eef1f3;
    }

    body {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 20px;
      font-family: Arial, sans-serif;
      line-height: 1.6;
      background-color: #ffffff;
      color: #333333;
    }

    /* Banner */

    header {
      margin-bottom: 25px;
    }

    .banner {
      position: relative;
      width: 100%;
    }

    .banner img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Name and university on the image */

    .banner-text {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);

      width: max-content;
      max-width: 85%;
      box-sizing: border-box;

      color: white;
      text-align: center;
      background: rgba(0, 0, 0, 0.45);
      padding: 12px 20px;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
      border-radius: 5px;
    }

    .banner-text h1 {
      margin: 0;
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      line-height: 1.2;
    }

    .banner-text p {
      margin: 5px 0 0;
      font-size: clamp(0.75rem, 1.8vw, 1rem);
      line-height: 1.3;
    }

    /* Navigation */

    nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 18px 0;
      border-top: 1px solid #dddddd;
      border-bottom: 1px solid #dddddd;
    }

    nav a {
      text-decoration: none;
      color: #333333;
      font-weight: 500;
    }

    nav a:hover {
      color: #666666;
      text-decoration: underline;
    }

    /* Page content */

    main {
      padding: 0 20px;
    }

    main h2 {
      font-size: 1.6em;
      margin-top: 30px;
      margin-bottom: 10px;
    }

    main h3 {
      font-size: 1.25em;
      margin-top: 25px;
      margin-bottom: 8px;
    }

    main a {
      color: #333333;
    }

    /* Footer */

    footer {
      margin-top: 50px;
      padding: 20px 0;
      border-top: 1px solid #dddddd;
      font-size: 0.9em;
      color: #666666;
    }

    /* Mobile adjustments */

    @media (max-width: 600px) {

      body {
        padding: 0 10px;
      }

      .banner-text {
        top: 10px;
        max-width: 90%;
        padding: 8px 12px;
      }

      .banner-text h1 {
        font-size: clamp(1.2rem, 6vw, 1.8rem);
      }

      .banner-text p {
        font-size: clamp(0.7rem, 3vw, 0.9rem);
      }

      nav {
        padding: 14px 0;
      }

      main {
        padding: 0 10px;
      }

    }

  </style>
</head>

<body>

  <header>

    <div class="banner">

      <img src="{{ '/assets/bannerImage.png' | relative_url }}" alt="Banner">

      <div class="banner-text">
        <h1>Simon Panaretou</h1>
        <p>Chemical Physics · University of Glasgow</p>
      </div>

    </div>

    <nav>
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/research.html' | relative_url }}">Research</a>
      <a href="{{ '/cv.html' | relative_url }}">CV</a>
      <a href="{{ '/contact.html' | relative_url }}">Contact</a>
    </nav>

  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <p>© {{ 'now' | date: "%Y" }} Simon Panaretou</p>
  </footer>

</body>
</html>
